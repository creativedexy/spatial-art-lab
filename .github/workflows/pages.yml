# Publish the living map to GitHub Pages.
#
# The site is assembled by scripts/build_site.py rather than served from the
# repository, because the repository also holds LiDAR intermediates, session
# notes, generation briefs and other people's copyrighted renders. The build
# copies out the files the page loads and nothing else.
#
# It runs WITHOUT --internal, so the campus type models stay behind: they
# derive from HBD's and Grimshaw's published renders and meshy/README.md says
# pitch work only. The map is built to survive that — the campus stands as the
# scheme's own extrusions — and scripts/test_public_build.py checks that it
# does. The step after the build fails the run if a pitch-only file reaches
# the folder anyway, because "we meant not to" is not a control.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run supersedes a waiting one but never
# interrupts a live deploy half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble the public site
        run: python3 scripts/build_site.py --out dist

      - name: Nothing pitch-only may leave
        run: |
          set -euo pipefail
          found=$(find dist \( -name '*.glb' -o -name '*.mp4' -o -name '*-hq.webm' \) -o -path '*inspiration*' -o -path '*meshy*')
          if [ -n "$found" ]; then
            echo "these must not be published:"; echo "$found"; exit 1
          fi
          python3 - <<'PY'
          import json
          import pathlib
          d = json.loads(pathlib.Path('dist/golden-valley/models.json').read_text())
          assert d['available'] == [], f"public build still claims models: {d['available']}"
          n = sum(1 for p in pathlib.Path('dist').rglob('*') if p.is_file())
          mb = sum(p.stat().st_size for p in pathlib.Path('dist').rglob('*') if p.is_file())
          print(f"clean: {n} files, {mb / 1048576:.2f} MB")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # A green deploy is not a live map.
      #
      # 12 Sep 2026: merging phase 11 took the public URL down and nothing went
      # red. Pages was still set to "Deploy from a branch", so every push to
      # main started TWO deployments — this workflow, and GitHub's own
      # "pages build and deployment", which Jekyll-builds the repository ROOT
      # and knows nothing about dist/. Whichever finishes last wins:
      #
      #   10 Sep  ours 20:41:12, theirs 20:41:04  -> the map was live, by 8 s
      #   12 Sep  ours 08:16:46, theirs 08:17:14  -> /golden-valley/ 404, by 28 s
      #
      # The map had been up on a coin toss since the day it was published. The
      # real fix is one repository setting — Settings > Pages > Build and
      # deployment > Source: GitHub Actions — which retires the branch build
      # and leaves this workflow the only deployer. Until that is done, or in
      # case it is ever turned back, this step makes the coin toss loud: it
      # waits past the window a competing deployment would land in, and then
      # asks the live URL whether the map is actually there.
      - name: The map is actually at the URL
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          url="${url%/}/golden-valley/index.html"
          echo "waiting 60s for any competing deployment to land, then checking $url"
          sleep 60
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/live.html -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "200" ] && grep -q 'id="app"' /tmp/live.html; then
              echo "live: the map is served from $url"
              exit 0
            fi
            echo "  attempt $attempt: HTTP $code"
            sleep 20
          done
          echo
          echo "The deploy succeeded and the map is NOT at the URL."
          if curl -sS "${{ steps.deployment.outputs.page_url }}" | grep -qi 'jekyll'; then
            echo "The site is serving a Jekyll build of the repository root, which"
            echo "means GitHub's branch-based Pages build deployed after this one."
            echo "Fix: Settings > Pages > Build and deployment > Source: GitHub Actions."
          fi
          exit 1
