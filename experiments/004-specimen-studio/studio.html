<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specimen Studio</title>
<style>
:root{--bg:#0b0c0b;--panel:#131513;--line:#2a2e2a;--ink:#e9eae4;--mut:#8d928a;--acc:#d7ff5a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:12px/1.4 ui-monospace,Menlo,monospace}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}
aside{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:14px 14px 40px}
h1{font:600 13px ui-monospace,Menlo,monospace;letter-spacing:.14em;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 12px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;letter-spacing:.1em;color:var(--mut);list-style:none}summary::before{content:'+ ';color:var(--acc)}details[open] summary::before{content:'– '}
label{display:grid;grid-template-columns:1fr 46px;gap:6px;align-items:center;margin:7px 0 0}label span{grid-column:1/-1;color:var(--mut);font-size:11px;letter-spacing:.06em}
input[type=range]{width:100%;accent-color:var(--acc)}output{text-align:right;color:var(--ink)}
select,button,input[type=color]{font:inherit;color:var(--ink);background:#0e100e;border:1px solid var(--line);border-radius:4px;padding:6px 8px}
select{width:100%;margin-top:4px}select.bind{margin:0;padding:3px 2px;font-size:10px;color:var(--acc)}button{cursor:pointer}button:hover{border-color:var(--acc)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.row button{flex:1}
.tog{display:flex;justify-content:space-between;align-items:center;margin-top:7px;color:var(--mut)}
main{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{max-width:calc(100% - 40px);max-height:calc(100vh - 150px);box-shadow:0 0 0 1px var(--line)}
.tl{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:8px;align-items:center}.tl button{min-width:44px}
#tlc{flex:1;width:100%;height:48px;max-width:none;max-height:none;box-shadow:none;cursor:pointer;border:1px solid var(--line);border-radius:4px}
#tc{min-width:128px;color:var(--ink);text-align:right}
.bar{position:absolute;top:10px;left:14px;right:14px;display:flex;gap:8px;justify-content:space-between;color:var(--mut)}
.drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000c;color:var(--acc);font-size:16px;letter-spacing:.2em}
.drop.on{display:flex}
#status{color:var(--acc)}
@media(max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:auto 60vh}aside{height:40vh}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>SPECIMEN STUDIO</h1>
  <p class="sub">Geometry and HUD over your images and video. Runs on this machine; nothing is uploaded.</p>
  <div class="row"><button id="load">+ Source</button><select id="preset" aria-label="Preset"></select></div>
  <div class="row" id="libRow" hidden><select id="plate" aria-label="Plate"></select><select id="shot" aria-label="Shot"></select><select id="track" aria-label="Audio track"></select></div>
  <div class="row"><button id="audio">+ Audio</button><button id="noaudio" title="Stop and remove the track">✕ Audio</button><span id="aname" style="color:var(--mut);align-self:center"></span></div>
  <div class="row"><button id="rnd">Random field</button><button id="save">Save preset</button><button id="copy">Copy JSON</button></div>
  <div class="row"><button id="saveshot">Save shot (for make.py)</button></div>
  <div id="controls"></div>
  <details open><summary>OUTPUT</summary>
    <label><span>FORMAT</span><select id="format"><option value="1280x720">WIDE 16:9 · 1280×720</option><option value="1080x1920">REELS 9:16 · 1080×1920</option><option value="720x1280">STORY 9:16 · 720×1280</option><option value="1080x1350">PORTRAIT 4:5 · 1080×1350</option><option value="1080x1080">SQUARE 1:1 · 1080×1080</option></select></label>
    <label><span>LENGTH (S)</span><select id="length"><option>5</option><option selected>8</option><option>10</option><option>12</option></select></label>
    <div class="row"><button id="png">Export PNG</button><button id="webm">Record WebM</button></div>
  </details>
</aside>
<main>
  <div class="bar"><span id="info"></span><span id="status"></span></div>
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="tl"><button id="play" title="Play / pause (space)">❚❚</button><span id="tc">0:00.0</span><canvas id="tlc" height="48" title="Click or drag to scrub. ⌥-click a cue to delete it. ← → jump a bar."></canvas><button id="addcue" title="Save the current look as a cue at this bar (C)">+ Cue</button></div>
  <div class="drop" id="drop">DROP IMAGE OR VIDEO</div>
  <input type="file" id="file" accept="image/*,video/*" hidden><input type="file" id="afile" accept="audio/*" hidden>
</main>
</div>
